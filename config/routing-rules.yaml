rules:
  - name: "Trivial"
    target: gemma
    conditions:
      patterns:
        - "syntax error"
        - "typo"
        - "fix typo"
        - "rename"
        - "format"
        - "indent"
        - "missing comma"
        - "missing semicolon"
        - "trailing space"
        - "spelling"
      max_length: 300
    exclude_patterns:
      - "architect"
      - "design"
      - "implement"
      - "refactor"

  - name: "Read & Explain"
    target: gemma
    conditions:
      patterns:
        - "read"
        - "read the file"
        - "show me"
        - "what is in"
        - "open the file"
        - "look at"
        - "explain this"
        - "explain the"
        - "what does this do"
        - "what is this"
        - "summarize"
        - "describe"
        - "list the"
        - "show the"
        - "print the"
        - "what are the"
        - "how many"
        - "find the"
        - "search for"
        - "grep"
        - "ls"
        - "dir"
    exclude_patterns:
      - "architect"
      - "design"
      - "implement"
      - "refactor entire"
      - "microservice"

  - name: "Basic Questions"
    target: gemma
    conditions:
      patterns:
        - "what is"
        - "what's"
        - "how do i"
        - "how does"
        - "can you"
        - "tell me"
        - "who are"
        - "which model"
        - "what model"
        - "what day"
        - "what time"
        - "what version"
        - "where is"
        - "show me how"
        - "give me"
        - "help me understand"
      max_length: 500
    exclude_patterns:
      - "architect"
      - "implement"
      - "design system"
      - "microservice"
      - "security"

  - name: "Testing"
    target: codex
    conditions:
      patterns:
        - "write test"
        - "unit test"
        - "integration test"
        - "test suite"
        - "mock"
        - "stub"
        - "debug"
        - "trace"
        - "stack trace"
        - "error message"
        - "why does"
        - "what does this error"

  - name: "Features"
    target: gemini-pro
    conditions:
      patterns:
        - "implement"
        - "create"
        - "add feature"
        - "build"
        - "component"
        - "endpoint"
        - "api"
        - "function"
        - "class"
        - "module"
        - "hook"
        - "middleware"
      max_length: 2000
    exclude_patterns:
      - "microservice"
      - "distributed"
      - "scalable"
      - "architect"
      - "system design"

  - name: "Complex"
    target: claude
    conditions:
      patterns:
        - "architect"
        - "design system"
        - "microservice"
        - "distributed"
        - "scalable"
        - "security audit"
        - "performance optimization"
        - "refactor entire"
        - "system design"
        - "trade-off"
        - "technical decision"
